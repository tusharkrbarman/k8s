# Replace repoURL with the actual Git remote before applying.
# This placeholder is intentionally not a valid repository URL.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openvino-llm-poc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPLACE_WITH_GIT_REPOSITORY_URL
    targetRevision: codex/aws-eks-openvino-poc
    path: k8s/aws
    directory:
      recurse: false
      exclude: argocd-application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
