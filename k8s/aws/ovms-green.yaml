apiVersion: v1
kind: Service
metadata:
  name: ovms-green-headless
  namespace: llm-inference
  labels:
    app: ovms-llm
    color: green
spec:
  clusterIP: None
  selector:
    app: ovms-llm
    color: green
  ports:
    - name: rest
      port: 8000
      targetPort: rest
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ovms-green
  namespace: llm-inference
  labels:
    app: ovms-llm
    color: green
spec:
  replicas: 2
  serviceName: ovms-green-headless
  selector:
    matchLabels:
      app: ovms-llm
      color: green
  template:
    metadata:
      labels:
        app: ovms-llm
        color: green
    spec:
      serviceAccountName: ovms-model-reader
      nodeSelector:
        nodepool: m7i-inference
        inference: openvino-cpu
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ovms-llm
              color: green
      initContainers:
        - name: sync-model
          image: public.ecr.aws/aws-cli/aws-cli:2.17.0
          command:
            - aws
            - s3
            - sync
            - s3://REPLACE_WITH_MODEL_BUCKET_NAME/OpenVINO/Phi-3-mini-FastDraft-50M-int8-ov
            - /models/OpenVINO/Phi-3-mini-FastDraft-50M-int8-ov
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: ovms
          image: openvino/model_server@sha256:19cda71ccab73930d0a65e48ea27c3464ce2c00cec326f0831457ae525831321
          imagePullPolicy: IfNotPresent
          args:
            - --source_model
            - OpenVINO/Phi-3-mini-FastDraft-50M-int8-ov
            - --model_repository_path
            - /models
            - --task
            - text_generation
            - --rest_port
            - "8000"
            - --target_device
            - CPU
            - --cache_size
            - "2"
          ports:
            - name: rest
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /v1/config
              port: rest
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/config
              port: rest
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/config
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
            limits:
              cpu: "8"
              memory: 24Gi
          volumeMounts:
            - name: model-cache
              mountPath: /models
  volumeClaimTemplates:
    - metadata:
        name: model-cache
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ovms-green-service
  namespace: llm-inference
  labels:
    app: ovms-llm
    color: green
spec:
  type: ClusterIP
  selector:
    app: ovms-llm
    color: green
  ports:
    - name: rest
      port: 8000
      targetPort: rest
