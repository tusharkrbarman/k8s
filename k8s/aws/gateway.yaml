apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  namespace: llm-inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-inference
  labels:
    app: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      serviceAccountName: llm-gateway
      nodeSelector:
        nodepool: m7i-inference
      containers:
        - name: gateway
          image: REPLACE_WITH_GATEWAY_ECR_IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - name: OVMS_URL
              valueFrom:
                configMapKeyRef:
                  name: llm-gateway-config
                  key: OVMS_URL
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: llm-gateway-config
                  key: MODEL_NAME
            - name: API_KEY_FILE
              value: /mnt/secrets-store/api-key
            - name: REQUEST_TIMEOUT_SECONDS
              value: "120"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: gateway-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-service
  namespace: llm-inference
  labels:
    app: llm-gateway
spec:
  type: ClusterIP
  selector:
    app: llm-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
